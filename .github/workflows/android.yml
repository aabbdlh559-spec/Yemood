# Builds the Yemood Android APK in the cloud. Run it by hand from the Actions tab
# ("Build Android APK" > "Run workflow"); no computer is needed.
#
# One-time setup (repository Settings > Secrets and variables > Actions):
#   Variables:  YEMOOD_SERVER_URL        the https:// address of the deployed Worker
#   Secrets (optional, for an APK that can be updated in place over the previous one):
#               ANDROID_KEYSTORE_BASE64  your release keystore, base64-encoded
#               ANDROID_KEYSTORE_PASSWORD
#               ANDROID_KEY_ALIAS
#               ANDROID_KEY_PASSWORD
# Without the secrets the build is signed with a temporary debug key: it installs fine, but a
# later build has a different key, so the older app must be uninstalled first.
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YEMOOD_SERVER_URL: ${{ vars.YEMOOD_SERVER_URL }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - name: Require the server address
        run: |
          case "$YEMOOD_SERVER_URL" in
            https://*) ;;
            *) echo "::error::Set the repository variable YEMOOD_SERVER_URL to the https:// address of the deployed Worker."; exit 1 ;;
          esac

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create the native Android project
        run: npx cap add android

      - name: Apply the Yemood name, icons and window handling
        run: cp -R android-overrides/. android/

      - name: Sync the web directory and the config
        run: npx cap sync android

      - name: Build the APK
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Sign the release APK with your key
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore secret set; shipping the debug-signed APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yemood.keystore"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/yemood.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/Yemood.apk" "$RUNNER_TEMP/aligned.apk"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Collect the APK
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            cp "$RUNNER_TEMP/Yemood.apk" "$RUNNER_TEMP/out/Yemood.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/out/Yemood.apk"
          fi

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: Yemood-apk
          path: ${{ runner.temp }}/out/Yemood.apk
          if-no-files-found: error
